[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsquire"
version = "0.1.0"
description = "Agents prepare the scripts, you run them, and every run is recorded for the next agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
lint = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
opsquire = "opsquire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsquire = ["data/*.json", "data/*.toml", "data/*.ini", "data/*.md", "data/helpers/*", "data/templates/*"]

[tool.mypy]
strict = true
mypy_path = "src/opsquire/data/helpers"
exclude = ["^src/opsquire/data/"]
