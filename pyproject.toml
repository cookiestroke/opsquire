[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsquire"
version = "0.3.0"
description = "Agents prepare the scripts, you run them, and every run is recorded for the next agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/cookiestroke/opsquire"
Releases = "https://github.com/cookiestroke/opsquire/releases"

[project.optional-dependencies]
lint = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
opsquire = "opsquire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsquire = ["py.typed", "data/*.json", "data/*.toml", "data/*.ini", "data/*.md", "data/*.html", "data/helpers/*", "data/templates/*", "data/skills/*/*"]

[tool.mypy]
strict = true
mypy_path = "src/opsquire/data/helpers"
exclude = ["^src/opsquire/data/"]
