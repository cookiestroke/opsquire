<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opsquire</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --line: #d9dde3; --line2: #e9ecf0;
  --fg: #1c2127; --muted: #5f6b7a; --faint: #8b95a3;
  --accent: #2563a8; --accent-bg: #e3edf9; --accent-fg: #1a4b86;
  --good: #1f7a3f; --good-bg: #e1f3e7; --bad: #b42323; --bad-bg: #fbe4e4;
  --warn: #8a5a00; --warn-bg: #fdf0d2; --grey: #5a6472; --grey-bg: #e8ebef;
  --code-bg: #eef1f4; --shadow: 0 8px 24px rgba(20, 30, 40, .18);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #15181c; --panel: #1d2126; --panel2: #23282e; --line: #343a42; --line2: #2b3138;
    --fg: #e3e7eb; --muted: #a3acb8; --faint: #76808c;
    --accent: #6ea6e8; --accent-bg: #1f2f45; --accent-fg: #a9cbf2;
    --good: #6ccc8a; --good-bg: #1a3324; --bad: #f08a8a; --bad-bg: #44201f;
    --warn: #f0c060; --warn-bg: #3d2f12; --grey: #aab3bf; --grey-bg: #2b3139;
    --code-bg: #12151a; --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
html { font-size: 13.5px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
.mono, code, pre, kbd, .id, .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .93em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
input:focus, select:focus, textarea:focus, button:focus-visible, .head:focus-visible, .run:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.brand { font-weight: 650; font-size: 1.1rem; letter-spacing: .01em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
#search { flex: 1 1 180px; min-width: 120px; max-width: 420px; }
#conn { color: var(--muted); font-size: .9em; white-space: nowrap; }
#conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-right: 5px; }
#conn.live::before { background: var(--good); }
#conn.down::before { background: var(--bad); }
.wrap { padding: 12px 16px 48px; max-width: 1280px; margin: 0 auto; }
#strip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: .95em; }
#strip .lbl { color: var(--muted); margin-right: 4px; }
#strip .home { color: var(--muted); margin-left: auto; word-break: break-all; }
.strip-item { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; scroll-margin-top: 70px; }
.row .row { border-color: var(--line2); margin: 6px 0; }
.row .row .row { background: var(--panel2); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 10px; cursor: pointer; border-radius: 8px; }
.head:hover { background: var(--panel2); }
.row .row .head:hover { background: var(--bg); }
.chev { display: inline-block; width: 0; height: 0; border: 5px solid transparent; border-left: 6px solid var(--faint); margin-right: 2px; transition: transform .12s; flex: none; }
.row.open > .head .chev { transform: rotate(90deg); }
.body { padding: 2px 10px 10px 24px; border-top: 1px solid var(--line2); }
.title { font-weight: 600; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .9em; }
.line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin: 3px 0; }
.full { flex-basis: 100%; }
.pill { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: .85em; font-weight: 600; line-height: 1.6; border: 1px solid transparent; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.grey { background: var(--grey-bg); color: var(--grey); }
.pill.live { background: var(--accent-bg); color: var(--accent-fg); }
.pill.neutral { background: transparent; color: var(--muted); border-color: var(--line); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: .85em; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.tag.accent { background: var(--accent-bg); color: var(--accent-fg); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.mono { font-size: .82em; }
.count { color: var(--muted); font-size: .9em; }
.sugg { color: var(--warn); }
.sugg .tag { margin-right: 4px; }
.err { color: var(--bad); }
.note { background: var(--panel2); border-left: 3px solid var(--line); padding: 4px 8px; margin: 4px 0; border-radius: 0 4px 4px 0; white-space: pre-wrap; }
.note.good { border-color: var(--good); }
.note.warn { border-color: var(--warn); }
.note.bad { border-color: var(--bad); }
.cmds { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; align-items: flex-start; }
.cmd { display: inline-flex; align-items: center; gap: 8px; background: var(--code-bg); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 4px 3px 8px; max-width: 100%; }
.cmd span { overflow-wrap: anywhere; }
.cmd button { padding: 1px 7px; font-size: .9em; }
.runs { margin: 4px 0; }
.run { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--line2); cursor: pointer; border-radius: 4px; }
.run:hover { background: var(--bg); }
.run:first-child { border-top: 0; }
.run .id { color: var(--faint); font-size: .85em; }
.run ul { margin: 0; padding-left: 18px; flex-basis: 100%; }
h4 { margin: 10px 0 4px; font-size: .85em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.form { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; display: grid; gap: 6px; max-width: 640px; }
.form textarea { width: 100%; min-height: 70px; resize: vertical; }
.form label { margin-right: 10px; }
.empty { color: var(--muted); padding: 14px 4px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .95em; }
.tbl th, .tbl td { text-align: left; padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--line2); }
.tbl th { color: var(--muted); font-weight: 600; border-top: 0; font-size: .9em; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--bg); }
.scroll { overflow-x: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 10; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
#drawer .dh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#drawer .dh .title { overflow-wrap: anywhere; }
#drawer .db { flex: 1; overflow: auto; padding: 10px 14px; }
#drawer pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; line-height: 1.4; }
#drawer .db.log { background: var(--code-bg); }
.md h3, .md h4, .md h5, .md h6 { margin: 10px 0 4px; text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 1em; }
.md h3 { font-size: 1.15em; }
.md h4 { font-size: 1.05em; }
.md p { margin: 4px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 22px; }
.md pre { background: var(--code-bg); padding: 6px 8px; border-radius: 5px; overflow-x: auto; }
.md code { background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
.md pre code { padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.result { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 20; font-size: .95em; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 700px) {
  .body { padding-left: 12px; }
  #strip .home { margin-left: 0; flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Opsquire</span>
  <div class="seg" role="tablist" id="seg"></div>
  <input id="search" type="search" placeholder="Search id, purpose, area, target  ( / )" aria-label="Search">
  <span id="conn" title="Connection to the local server">connecting</span>
</header>
<div class="wrap">
  <div id="strip"></div>
  <main id="main"><div class="empty">Loading the home.</div></main>
</div>
<aside id="drawer" hidden aria-label="Details"></aside>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ---- pure helpers (no DOM) ---- */
const VIEWS = [['threads', 'Threads'], ['targets', 'Targets'], ['scripts', 'Scripts']];
const TONE = {

  ready: 'neutral', draft: 'grey', abandoned: 'grey', superseded: 'grey', archived: 'grey', skipped: 'grey',
  unchanged: 'grey', interrupted: 'grey', aborted: 'grey', merged: 'good', waiting: 'warn', alive: 'good', dead: 'grey',

function tone(status) { return TONE[status] || 'neutral'; }
function parseTime(iso) { const t = iso ? Date.parse(iso) : NaN; return Number.isNaN(t) ? null : t; }

}
function relTime(iso, nowMs) {
  const t = parseTime(iso); if (t === null) return iso ? String(iso) : '-';
  let s = Math.round(((nowMs === undefined ? Date.now() : nowMs) - t) / 1000);
  const future = s < 0; s = Math.abs(s);
  if (s < 45) return 'just now';
  const txt = s < 90 ? '1 min' : s < 3600 ? `${Math.round(s / 60)} min` : s < 86400 ? `${Math.round(s / 3600)} h`
    : s < 86400 * 14 ? `${Math.round(s / 86400)} d` : s < 86400 * 60 ? `${Math.round(s / 86400 / 7)} w` : `${Math.round(s / 86400 / 30)} mo`;
  return future ? `in ${txt}` : `${txt} ago`;
}
function duration(sec) {

  const s = Math.max(0, Number(sec));

  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60), r = Math.round(s % 60);

}
function linkLabel(url) {

  let m = /github\.com\/[^/]+\/([^/]+)\/(?:pull|issues)\/(\d+)/.exec(u);
  if (m) return `${m[1]}#${m[2]}`;
  m = /github\.com\/[^/]+\/([^/]+)/.exec(u);
  if (m) return m[1];
  if (/slack\.com\//.test(u)) return 'slack';
  m = /^[a-z]+:\/\/([^/]+)/.exec(u);
  return m ? m[1] : u;
}
function safeHref(url) { return /^https?:\/\//.test(String(url || '')) ? String(url) : null; }
function money(x) { return typeof x === 'number' ? `$${x.toFixed(2)}` : ''; }
function truncate(text, n) { const s = String(text || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '...' : s; }
function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }
function statsText(stats, changesProd) {
  if (!stats || !stats.runs) return 'never run';
  let t = `${plural(stats.runs, 'run')}, ${stats.ok} ok ${changesProd ? 'apply' : 'read'}`;
  if (changesProd && stats.ok) t += `, ${stats.per_ok} runs per ok apply`;
  return t;
}
function scriptStats(st) {
  if (!st || !st.runs) return 'never run';
  return `${plural(st.runs, 'run')}, ${st.ok} ok, ${st.ok ? st.per_ok + ' runs per ok apply' : 'no ok apply yet'}`;
}
function hay(parts) { return parts.flat().filter(x => x !== null && x !== undefined).join(' ').toLowerCase(); }
function taskMatches(task, q, extra) {
  if (!q) return true;
  return hay([task.id, task.purpose, task.area, task.targets || [], task.uses || [], task.status, task.author, extra || '']).includes(q);
}
function threadMatches(thread, q) { return !q || hay([thread.id, thread.title, thread.areas || [], thread.targets || []]).includes(q); }
function sortByUpdated(threads) { return [...threads].sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || ''))); }
function targetIndex(data) {
  const map = new Map();
  const get = name => { if (!map.has(name)) map.set(name, { name, entries: [], declared: [] }); return map.get(name); };
  for (const t of Object.values(data.tasks || {})) for (const name of t.targets || []) get(name).declared.push(t.id);
  for (const r of Object.values(data.runs || {})) {
    for (const [name, st] of Object.entries(r.targets || {})) get(name).entries.push({ time: String(r.ended || r.started || ''), run: r, tstatus: st });
  }
  for (const g of map.values()) {
    g.entries.sort((a, b) => b.time.localeCompare(a.time));
    g.last = g.entries[0] || null;
    g.lastApply = g.entries.find(e => e.run.mode === 'apply') || null;
  }
  return [...map.values()].sort((a, b) => ((b.last && b.last.time) || '').localeCompare((a.last && a.last.time) || '') || a.name.localeCompare(b.name));
}
function asksForThread(asks, thread) {

  return (asks || []).filter(a => (a.task_ids || []).some(id => ids.has(id)));
}
function parseHash(h) {

}
/* minimal markdown: headings, paragraphs, lists, fenced code, rules, inline code, links, bold. Only text nodes, never HTML. */
function inlineMd(text) {

  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(el('code', {}, m[1].slice(1, -1)));
    else if (m[2]) out.push(el('a', { href: m[3], target: '_blank', rel: 'noopener' }, m[2]));

}
function markdown(text) {

  const flushPara = () => { if (para.length) { root.append(el('p', {}, inlineMd(para.join(' ')))); para = []; } };
  const flush = () => { flushPara(); list = null; };

    const line = lines[i]; let m;
    if (line.startsWith('```')) {
      flush(); const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
      i++; root.append(el('pre', {}, el('code', {}, buf.join('\n')))); continue;
    }
    if ((m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line))) { flush(); root.append(el(`h${Math.min(m[1].length + 2, 6)}`, {}, inlineMd(m[2]))); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); root.append(el('hr')); i++; continue; }

      flushPara();
      const tag = m[1] ? 'ol' : 'ul';
      if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag); root.append(list); }
      list.append(el('li', {}, inlineMd(m[2]))); i++; continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    if (list && /^\s{2,}\S/.test(line)) { list.lastChild.append(' ', ...inlineMd(line.trim())); i++; continue; }

/* ---- DOM helpers ---- */
function el(tag, attrs, ...children) {

function append(n, c) {

const $ = sel => document.querySelector(sel);
function pill(status) { return el('span', { class: `pill ${tone(status)}` }, status || '?'); }
function when(iso) { return el('span', { class: 'muted', title: utc(iso) }, relTime(iso)); }
function tag(text, cls) { return el('span', { class: `tag ${cls || ''}` }, text); }
function modeTag(mode) { return tag(mode || '?', 'mono' + (mode === 'apply' ? ' accent' : '')); }
function linkTag(url) {

let toastTimer = null;
function toast(msg) {

}

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null;
  try { body = await r.json(); } catch (e) { body = null; }

/* ---- state ---- */
const S = { data: null, view: 'threads', q: '', open: new Set(), hash: null, scrollTo: null, drawer: null, closeForm: null, error: null };

  else if (kind === 'target') focus('targets', 'g:' + id);

function toggle(key, hash) {

  try {
    const r = await api(`/api/file?task=${encodeURIComponent(t.id)}&name=${encodeURIComponent(name)}`);
    if (!S.drawer || S.drawer.task !== t.id || S.drawer.name !== name) return;
    if (r.text === null || r.text === undefined) body.replaceWith(el('div', { class: 'muted' }, `No ${name} in this task.`));
    else body.replaceWith(name.endsWith('.md') ? markdown(r.text) : el('pre', {}, r.text));
  } catch (e) { body.replaceWith(el('div', { class: 'err' }, e.message)); }
}
function openScript(t) { openFile(t, t.entry || 'main.py'); }
/* ---- data flow ---- */
let refreshTimer = null, loading = false, loadAgain = false;
function refresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(load, 150); }
async function load() {
  if (loading) { loadAgain = true; return; }
  loading = true;
  try {
    const data = await api('/api/state');
    if (data && typeof data === 'object') { S.data = data; S.error = null; }
    if (S.hash === null) applyHash(); else render();
  } catch (e) {
    S.error = `state: ${e.message}`;
    if (S.data) renderStrip(); else $('#main').replaceChildren(empty(`Cannot load the home: ${e.message}`));
  }
  loading = false;
  if (loadAgain) { loadAgain = false; refresh(); }
}
let es = null, backoff = 1000;
function setConn(state, text) { const c = $('#conn'); c.className = state; c.textContent = text; }
function connect() {
  if (es) es.close();
  es = new EventSource('/api/stream');
  es.addEventListener('hello', () => { backoff = 1000; setConn('live', 'live'); refresh(); });
  es.addEventListener('change', () => refresh());
  es.onerror = () => {
    es.close(); es = null;
    setConn('down', `reconnecting in ${Math.round(backoff / 1000)}s`);
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30000);
  };
}
function boot() {
  const search = $('#search');
  let qTimer = null;
  search.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = search.value.trim().toLowerCase(); render(); }, 120); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape') { if (S.drawer) closeDrawer(); else if (typing) e.target.blur(); }
    else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); search.focus(); search.select(); }
  });
  window.addEventListener('hashchange', () => { if (S.data) applyHash(); });
  setInterval(() => { if (S.data && !document.hidden) render(); }, 60000);
  connect();
  load();
}
boot();
</script>
