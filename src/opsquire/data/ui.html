<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opsquire</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f3; --line: #d6dae0; --line2: #e7eaee;
  --fg: #1c2127; --muted: #5f6b7a; --faint: #8b95a3;
  --accent: #2563a8; --accent-bg: #e3edf9; --accent-fg: #1a4b86;
  --good: #1f7a3f; --good-bg: #dff2e6; --bad: #b42323; --bad-bg: #fbe4e4;
  --warn: #8a5a00; --warn-bg: #fdefcf; --grey: #5a6472; --grey-bg: #e6e9ed;
  --code-bg: #eef1f4; --shadow: 0 8px 24px rgba(20, 30, 40, .18);
  --top: 44px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #15181c; --panel: #1d2126; --panel2: #23282e; --line: #343a42; --line2: #2b3138;
    --fg: #e3e7eb; --muted: #a3acb8; --faint: #76808c;
    --accent: #6ea6e8; --accent-bg: #1f2f45; --accent-fg: #a9cbf2;
    --good: #6ccc8a; --good-bg: #1a3324; --bad: #f08a8a; --bad-bg: #44201f;
    --warn: #f0c060; --warn-bg: #3d2f12; --grey: #aab3bf; --grey-bg: #2b3139;
    --code-bg: #12151a; --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
html { font-size: 15px; }
html.dev { font-size: 13.5px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
.mono, code, pre, kbd, .id, .cmd, .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .93em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button.sm { padding: 1px 7px; font-size: .9em; }
button:disabled { opacity: .5; cursor: default; }
button.runbtn.apply { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); font-weight: 600; }
button.runbtn.apply.armed { background: var(--warn); color: #fff; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
input:focus, select:focus, textarea:focus, button:focus-visible, .head:focus-visible, .run:focus-visible, .trow:focus-visible, .ib:focus-visible, .job:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.brand { font-weight: 650; font-size: 1.1rem; letter-spacing: .01em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.seg .n { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 5px; border-radius: 8px; font-size: .8em; background: var(--warn); color: #fff; line-height: 1.5; }
#search { flex: 1 1 180px; min-width: 120px; max-width: 420px; }
#conn { color: var(--muted); font-size: .9em; white-space: nowrap; }
#conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--grey); margin-right: 5px; }
#conn.live::before { background: var(--good); }
#conn.down::before { background: var(--bad); }
.app { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
main#main { padding: 12px 16px 48px; min-width: 0; }
#pane { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
#pane .ph { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); flex: none; }
#pane .ph .title { overflow-wrap: anywhere; }
#pane .pb { flex: 1 1 auto; overflow: auto; padding: 10px 14px; min-height: 0; }
#pane .pb.log { background: var(--code-bg); }
#pane .pb pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; line-height: 1.4; }
#pane .pf { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; flex: none; background: var(--panel); }
#pane .placeholder { color: var(--faint); padding: 24px 14px; }
@media (min-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) 40%; }
  header.top { flex-wrap: nowrap; height: var(--top); padding-block: 0; }
  .stale { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); z-index: 4; }
  #pane { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); }
}
@media (max-width: 1099px) {
  #pane { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); box-shadow: var(--shadow); z-index: 10; padding-top: env(safe-area-inset-top, 0px); }
  #pane:not(.open) { display: none; }
}
#liveline { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 4px 10px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: .95em; }
#liveline:empty { display: none; }
.live-item { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
h3.sec { margin: 14px 0 6px; font-size: .85em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
h3.sec:first-child { margin-top: 2px; }
h3.sec .n { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.quiet { color: var(--muted); padding: 10px 12px; }
.ib, .job, .tr { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line2); }
.ib:first-child, .job:first-child, .tr:first-child { border-top: 0; }
.ib:hover, .job:hover, .tr:hover { background: var(--panel2); }
.ib .purpose, .job .purpose, .tr .purpose, .trow .purpose { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib .who, .tr .who { color: var(--muted); white-space: nowrap; }
.job { cursor: pointer; }
.job .prompt { flex-basis: 100%; color: var(--warn); white-space: pre-wrap; }
.asking { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 10px 0; padding: 8px 12px; border: 1px solid var(--warn); border-radius: 6px; }
.warnnote { color: var(--warn); font-size: .86em; }
.job .answers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mode { display: inline-block; min-width: 44px; text-align: center; padding: 0 6px; border-radius: 4px; font-size: .82em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.mode.apply { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; scroll-margin-top: 70px; }
.row.inferred { border-left: 2px dotted var(--faint); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 7px 10px; cursor: pointer; border-radius: 8px; }
.head:hover { background: var(--panel2); }
.chev { display: inline-block; width: 0; height: 0; border: 5px solid transparent; border-left: 6px solid var(--faint); margin-right: 2px; transition: transform .12s; flex: none; }
.row.open > .head .chev { transform: rotate(90deg); }
.body { padding: 4px 10px 10px 22px; border-top: 1px solid var(--line2); }
.title { font-weight: 600; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .9em; }
.line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin: 3px 0; }
.full { flex-basis: 100%; }
.pill { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: .85em; font-weight: 600; line-height: 1.6; border: 1px solid transparent; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.grey { background: var(--grey-bg); color: var(--grey); }
.pill.live { background: var(--accent-bg); color: var(--accent-fg); }
.pill.neutral { background: transparent; color: var(--muted); border-color: var(--line); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: .85em; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.tag.accent { background: var(--accent-bg); color: var(--accent-fg); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.mono { font-size: .82em; }
.count { color: var(--muted); font-size: .9em; }
.sugg { color: var(--warn); }
.sugg .tag { margin-right: 4px; }
.suggn { color: var(--warn); font-weight: 600; font-size: .85em; }
.err { color: var(--bad); }
.note { background: var(--panel2); border-left: 3px solid var(--line); padding: 4px 8px; margin: 4px 0; border-radius: 0 4px 4px 0; white-space: pre-wrap; }
.note.good { border-color: var(--good); }
.note.warn { border-color: var(--warn); }
.note.bad { border-color: var(--bad); }
.stale { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 5px; padding: 8px 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; overflow-wrap: anywhere; }
.stale b { color: var(--warn); }
.cmds { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; align-items: flex-start; }
.cmd { display: inline-flex; align-items: center; gap: 8px; background: var(--code-bg); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 4px 3px 8px; max-width: 100%; }
.cmd span { overflow-wrap: anywhere; }
.cmd button { padding: 1px 7px; font-size: .9em; }
.runs { margin: 4px 0; }
.run { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--line2); cursor: pointer; border-radius: 4px; }
.run:hover { background: var(--panel2); }
.run:first-child { border-top: 0; }
.run .id { color: var(--faint); font-size: .85em; }
.run ul { margin: 0; padding-left: 18px; flex-basis: 100%; }
h4 { margin: 12px 0 4px; font-size: .85em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.form { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; display: grid; gap: 6px; }
.form textarea { width: 100%; min-height: 70px; resize: vertical; }
.form label { margin-right: 10px; }
.empty { color: var(--muted); padding: 14px 4px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .95em; }
.tbl th, .tbl td { text-align: left; padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--line2); }
.tbl th { color: var(--muted); font-weight: 600; border-top: 0; font-size: .9em; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel2); }
.scroll { overflow-x: auto; }
.trow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 4px 8px; border-top: 1px solid var(--line2); cursor: pointer; border-radius: 4px; }
.trow:hover { background: var(--panel2); }
.trow.sel { background: var(--accent-bg); }
.trow.open .chev { transform: rotate(90deg); }
.trows { margin-top: 6px; }
.tdetail { padding: 2px 8px 6px 30px; border-top: 1px solid var(--line2); }
.md h3, .md h4, .md h5, .md h6 { margin: 10px 0 4px; text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 1em; display: block; }
.md h3 { font-size: 1.15em; }
.md h4 { font-size: 1.05em; }
.md p { margin: 4px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 22px; }
.md pre { background: var(--code-bg); padding: 6px 8px; border-radius: 5px; overflow-x: auto; }
.md code { background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
.md pre code { padding: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.result { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; z-index: 20; font-size: .95em; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.show { opacity: 1; }
/* diagrams */
svg.flow, svg.map { display: block; overflow: visible; }
.flow .box { fill: var(--panel2); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.flow .box.st-good { fill: var(--good-bg); stroke: var(--good); }
.flow .box.st-bad { fill: var(--bad-bg); stroke: var(--bad); }
.flow .box.st-warn { fill: var(--warn-bg); stroke: var(--warn); }
.flow .box.st-live { fill: var(--accent-bg); stroke: var(--accent); }
.flow .box.st-grey { fill: var(--grey-bg); stroke: var(--faint); stroke-dasharray: 2 2; }
.flow .box.st-neutral { fill: var(--panel); stroke: var(--muted); }
.flow .box:hover, .flow .box.sel { stroke: var(--accent); stroke-width: 2; }
.flow text { font-size: 10.5px; fill: var(--fg); pointer-events: none; }
.flow text.st-grey { fill: var(--muted); }
.flow .edge { fill: none; stroke: var(--faint); stroke-width: 1; }
.flow .edge.superseded { stroke-dasharray: 3 2; }
.flow .edge.step { stroke: var(--accent); }
.flow marker path { fill: var(--faint); }
.flow .dot.good, .map .dot.good { fill: var(--good); }
.flow .dot.bad, .map .dot.bad { fill: var(--bad); }
.flow .dot.warn, .map .dot.warn { fill: var(--warn); }
.flow .dot.live, .map .dot.live { fill: var(--accent); }
.flow .dot.grey, .flow .dot.neutral, .map .dot.grey, .map .dot.neutral { fill: var(--faint); }
.flowwrap { overflow-x: auto; padding: 8px 0 4px; }
.mini { flex: none; }
.map .lane { fill: var(--panel); }
.map .lane.alt { fill: var(--panel2); }
.map .grid { stroke: var(--line2); stroke-width: 1; }
.map .today { fill: var(--accent-bg); opacity: .55; }
.map .wk { fill: var(--grey-bg); opacity: .45; }
.map text { font-size: 11px; fill: var(--fg); }
.map .grid.strong { stroke: var(--line); }
.map .ax { fill: var(--muted); font-size: 10px; }
.map .ax.strong { fill: var(--fg); }
.map .ax.now { fill: var(--accent); }
.map .nowline { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
.map .blk.side { fill: var(--muted); }
.map text.lbl { fill: var(--muted); font-size: 11px; }
.map text.ax { fill: var(--muted); font-size: 10.5px; }
.map text.blk { font-size: 10.5px; pointer-events: none; }
.map text.blk.st-grey { fill: var(--muted); }
.map .tline { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: .5; }
.map .box { cursor: pointer; }
.map .box.st-good { fill: var(--good-bg); stroke: var(--good); }
.map .box.st-bad { fill: var(--bad-bg); stroke: var(--bad); }
.map .box.st-warn { fill: var(--warn-bg); stroke: var(--warn); }
.map .box.st-live { fill: var(--accent-bg); stroke: var(--accent); }
.map .box.st-grey { fill: var(--grey-bg); stroke: var(--faint); stroke-dasharray: 2 2; }
.map .box.st-neutral { fill: var(--panel); stroke: var(--muted); }
.map .box:hover, .map .box.sel { stroke: var(--accent); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--muted); font-size: .9em; margin: 6px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid; }
.legend i.good { background: var(--good-bg); border-color: var(--good); }
.legend i.bad { background: var(--bad-bg); border-color: var(--bad); }
.legend i.warn { background: var(--warn-bg); border-color: var(--warn); }
.legend i.live { background: var(--accent-bg); border-color: var(--accent); }
.legend i.neutral { background: var(--panel); border-color: var(--muted); }
.legend i.grey { background: var(--grey-bg); border-color: var(--faint); border-style: dashed; }
.legend i.dot { border-radius: 50%; width: 8px; height: 8px; }
.legend i.dot.good { background: var(--good); } .legend i.dot.bad { background: var(--bad); } .legend i.dot.warn { background: var(--warn); } .legend i.dot.grey { background: var(--faint); }
/* simple mode: tiles, chips, ticks, plain rows */
#devtoggle { background: transparent; color: var(--muted); border-color: transparent; }
#devtoggle[aria-pressed="true"] { color: var(--accent-fg); background: var(--accent-bg); border-color: var(--accent-bg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 2px 0 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; white-space: normal; }
.tile:hover { border-color: var(--accent); }
.tile .num { font-size: 2rem; font-weight: 650; line-height: 1.1; letter-spacing: -.01em; }
.tile .lbl { color: var(--muted); font-size: .95em; }
.tile.zero .num { color: var(--faint); }
.tile.amber .num { color: var(--warn); }
.tile.live .num { color: var(--accent); }
.tile.good .num { color: var(--good); }
.tile .act { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
html.dev .tile { padding: 8px 12px; border-radius: 8px; }
html.dev .tile .num { font-size: 1.5rem; }
.statsline { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .95em; margin: 0 2px 14px; }
.statsline b { color: var(--fg); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.chip { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: .85em; background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); white-space: nowrap; }
.chip b { color: var(--fg); font-weight: 600; }
.tick { display: inline-block; width: 1.3em; text-align: center; flex: none; font-weight: 600; }
.tick.done { color: var(--good); }
.tick.open { color: var(--faint); }
.tick.gone { color: var(--faint); }
.tick.busy { color: var(--accent); }
.name { font-weight: 600; overflow-wrap: anywhere; }
.area { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: .8em; background: var(--grey-bg); color: var(--muted); white-space: nowrap; }
.next { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .85em; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.next.apply { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.sr { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line2); }
.sr:first-child { border-top: 0; }
.sr:hover { background: var(--panel2); }
.ibgroup { border-top: 1px solid var(--line2); }
.ibgroup:first-child { border-top: 0; }
.ibgroup .sr, .ibgroup .ib { border-top: 0; }
.ibgroup > .sr, .ibgroup > .ib { padding-bottom: 4px; }
.substeps { margin: 0 0 8px 22px; }
.sr.sub, .ib.sub { padding-top: 4px; padding-bottom: 4px; font-size: .95em; }
.sr.sub:hover, .ib.sub:hover { background: var(--panel2); }
.sr.sub .purpose, .ib.sub .purpose { color: var(--muted); }
.tree { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre; }
.stepno { display: inline-block; min-width: 1.5em; height: 1.5em; line-height: 1.5em; text-align: center; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-size: .85em; font-weight: 600; }
.plan { color: var(--muted); font-size: .9em; white-space: nowrap; }
.sr .purpose { flex: 1 1 240px; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr .verdict { flex-basis: 100%; color: var(--muted); font-size: .92em; padding-left: 1.6em; white-space: pre-wrap; }

/* ---- data flow ---- */
let refreshTimer = null, loading = false, loadAgain = false, retry = 2000;

let es = null, backoff = 1000;
